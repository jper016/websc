        /* Changed from flex column to CSS Grid */
        .container-list {
            max-width: 1200px;

            display: grid;

        .container {
            display: flex;
            flex-direction: column; /* Stacks image, title, and button vertically inside the card */

            text-align: center;
            background-color: #f4ffb0;
            border: 1px solid #ccc;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            padding: 20px;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;

        .container:hover {
            background-color: #f5faff;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        .container img {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 0; /* Removed right margin */
            margin-bottom: 15px; /* Added bottom margin for vertical spacing */

        .container-title {
            flex: 1;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px; /* Added space before the button */
        }

        .open-btn {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            width: 100%; /* Makes the button stretch nicely across the card */
        }

        .open-btn:hover {
            background-color: #0056b3;
        }
    </style>
